<style>
/* Layout: Pickle press chrome (riso paper, green + pink) around one card stack. The cards carry all other looks. */
:root {
  --paper: #eceee4;
  --card: #f5f6ef;
  --green: #00915a;
  --pink: #ff4aa2;
  --ink: #12352a;
  --muted: #4c6a5e;
  --line: #c8d0bf;
  --display: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
  --body: "Work Sans", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
.app { max-width: 470px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header h1 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; margin: 0; color: var(--green); text-shadow: 2px 2px 0 var(--pink); }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); width: 0; transition: width .25s; }
.phase { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.phase b { color: var(--pink); font-weight: 500; }
.hint { color: var(--muted); font-size: 13px; margin: 0; text-wrap: balance; }

.stack { position: relative; aspect-ratio: 4 / 5.3; width: 100%; max-width: 100%; }
.card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: var(--card); border: 2px solid var(--ink); display: flex; flex-direction: column; touch-action: none; user-select: none; cursor: grab; transition: transform .3s ease, opacity .3s; box-shadow: 5px 5px 0 var(--pink); }
.card.behind { transform: scale(.95) translateY(12px); pointer-events: none; box-shadow: none; }
.card.dragging { transition: none; cursor: grabbing; }
.spec { flex: 1; position: relative; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; min-height: 0; }
.spec .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.spec .word { line-height: .9; margin: 0; overflow-wrap: anywhere; }
.spec .line { font-size: 14px; max-width: 26ch; opacity: .85; }
.spec .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.spec .chips span { font-size: 12px; padding: 5px 10px; border-radius: 999px; }
.meta { padding: 10px 14px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border-top: 2px solid var(--ink); }
.meta b { font-size: 15px; }
.meta small { font-family: var(--mono); color: var(--muted); font-size: 11px; text-align: right; }
.badge { position: absolute; top: 12px; right: 12px; z-index: 2; font-family: var(--mono); font-size: 11px; padding: 3px 8px; background: var(--pink); color: var(--ink); text-transform: uppercase; letter-spacing: .08em; }
.stamp { position: absolute; top: 22px; padding: 6px 12px; border: 3px solid; font-family: var(--display); font-size: 22px; opacity: 0; background: rgba(255,255,255,.88); z-index: 3; }
.stamp.yes { left: 18px; color: var(--green); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: #d23a2a; transform: rotate(12deg); }

.controls { display: flex; justify-content: center; gap: 18px; }
.controls button { width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-size: 24px; cursor: pointer; display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink); }
.controls button.no { color: #d23a2a; }
.controls button.yes { color: var(--green); }
.controls button.undo { width: 46px; height: 46px; font-size: 17px; align-self: center; color: var(--muted); box-shadow: none; }
.controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.results { display: flex; flex-direction: column; gap: 14px; }
.results h2 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 6px 0 0; color: var(--green); text-wrap: balance; }
.results p { margin: 0; color: var(--muted); }
.dim { background: var(--card); border: 2px solid var(--ink); padding: 12px 14px; display: grid; gap: 7px; }
.dim h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--pink); }
.row { display: grid; grid-template-columns: 86px minmax(0, 1fr) 38px; align-items: center; gap: 10px; font-size: 14px; }
.row .track { height: 10px; background: var(--line); overflow: hidden; }
.row .track i { display: block; height: 100%; background: var(--green); }
.row span:last-child { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.liked { display: flex; flex-wrap: wrap; gap: 6px; }
.liked span { border: 1.5px solid var(--green); padding: 3px 10px; font-size: 13px; }
.liked span.remix { border-color: var(--pink); }
.status { font-weight: 600; }
textarea { width: 100%; min-height: 120px; font: 12px var(--mono); padding: 10px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--paper); padding: 10px 18px; font: 600 14px var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .card, .bar i { transition: none; } }
</style>

    bg:"#1f1f1f", fg:"#f4f4f4", ac:"#b6ff3b", font:"'Permanent Marker'", size:72, word:"BODRING", line:"made loud, made fast, made here",
    deco:"radial-gradient(circle at 80% 25%, rgba(182,255,59,.5) 0 30px, transparent 60px), radial-gradient(circle at 15% 85%, rgba(255,80,160,.45) 0 20px, transparent 55px)" },
  { id:"newspaper", name:"Broadsheet", mood:"premium", color:"mono", type:"serif", density:"bold",
    bg:"#f3f0e8", fg:"#141414", ac:"#141414", font:"'Fraunces'", weight:800, size:58, word:"The Bodring Times", line:"Local company launches apps, games; cucumbers unavailable for comment.",
    deco:"linear-gradient(#141414,#141414) 24px 22%/calc(100% - 48px) 2px no-repeat, linear-gradient(#141414,#141414) 24px 23.5%/calc(100% - 48px) 1px no-repeat" },
  { id:"casino", name:"Black & gold", mood:"premium", color:"dark", type:"condensed", density:"bold",
    bg:"#0e0d0b", fg:"#f2e3b3", ac:"#c9a227", font:"'Anton'", size:86, word:"BODRING", line:"The house always builds.",
    deco:"repeating-linear-gradient(135deg, rgba(201,162,39,.08) 0 2px, transparent 2px 14px)" },
  { id:"camp", name:"Forest camp", mood:"calm", color:"green", type:"hand", density:"minimal",
    bg:"#e6ead8", fg:"#2b3b26", ac:"#c46a2b", font:"'Caveat Brush'", size:80, word:"bodring co.", line:"slow-grown, hand-made, built to last",
    deco:"conic-gradient(from 150deg at 80% 30%, transparent 0 60deg, rgba(43,59,38,.25) 60deg 120deg, transparent 120deg)" },
  { id:"blueprint", name:"Blueprint", mood:"techy", color:"colorful", type:"mono", density:"minimal",
    bg:"#1d4e89", fg:"#e8f1ff", ac:"#ffd166", font:"'Space Mono', 'IBM Plex Mono'", weight:600, size:42, word:"BODRING/01", line:"SCALE 1:1 · SHEET 1 OF ∞ · DRAWN BY THE BODRING CO.",
    deco:"linear-gradient(rgba(232,241,255,.14) 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, rgba(232,241,255,.14) 1px, transparent 1px) 0 0/24px 24px" }
];

const TOTAL = 30, SEED = 12, AXES = ["mood", "color", "type", "density"];
const $ = id => document.getElementById(id);
const shown = [];   // cards in the order shown
const votes = [];   // {card, like}
let busy = false;

// Round 1: greedy pick so the first 12 cover as many tag values as possible.
function seedDeck() {
  const pool = V.slice().sort(() => Math.random() - .5), seen = new Set(), out = [];
  while (out.length < SEED) {
    let best = null, bestScore = -1;
    for (const c of pool) {
      if (out.includes(c)) continue;
      const s = AXES.filter(a => !seen.has(a + ":" + c[a])).length;
      if (s > bestScore) { best = c; bestScore = s; }
    }
    out.push(best); AXES.forEach(a => seen.add(a + ":" + best[a]));
  }
  return out;
}
const seed = seedDeck();

// Per tag value: likes and dislikes. Sampled score leans to likes but keeps exploring (Thompson-style).
function stats() {
  const m = {};
  votes.forEach(v => AXES.forEach(a => { const k = a + ":" + v.card[a]; m[k] = m[k] || { l: 0, d: 0 }; v.like ? m[k].l++ : m[k].d++; }));
  return m;
}
function sample(m, k) {
  const s = m[k] || { l: 0, d: 0 }, n = s.l + s.d;
  return (s.l + 1) / (n + 2) + (Math.random() - .5) * 0.7 / Math.sqrt(n + 1);
}
function remix(a, b) {
  return { ...a, id: "remix:" + a.id + "+" + b.id, name: a.name + " × " + b.name, remix: true,
    type: b.type, font: b.font, weight: b.weight, style: b.style, size: b.size };
}
function nextCard() {
  const i = shown.length;
  if (i < SEED) return seed[i];
  const m = stats(), used = new Set(shown.map(c => c.id));
  const liked = votes.filter(v => v.like).map(v => v.card).filter(c => !c.remix);
  const cands = V.filter(c => !used.has(c.id)).map(c => ({ c, kind: "explore" }));
  for (const a of liked) for (const b of liked) if (a !== b && a.type !== b.type) {
    const r = remix(a, b); if (!used.has(r.id)) cands.push({ c: r, kind: "remix" });
  }
  const explore = Math.random() < 0.25 || liked.length < 2;
  const pool = cands.filter(x => explore ? x.kind === "explore" : x.kind === "remix");
  const list = pool.length ? pool : cands;
  let best = list[0], top = -1;
  for (const x of list) { const s = AXES.reduce((t, a) => t + sample(m, a + ":" + x.c[a]), 0); if (s > top) { top = s; best = x; } }
  return best.c;
}

function cardEl(v) {
  const c = document.createElement("div");
  c.className = "card";
  const spec = document.createElement("div");
  spec.className = "spec";
  spec.style.background = v.deco === "none" ? v.bg : v.deco + ", " + v.bg;
  spec.style.backgroundColor = v.bg;
  spec.style.color = v.fg;
  const mono = v.type === "mono" || v.type === "pixel";
  spec.innerHTML = `
    <div class="eyebrow" style="font-family:${v.font}, system-ui; font-size:${v.type === "pixel" ? 8 : 11}px">bodr.ing · apps & games</div>
    <h2 class="word" style="font-family:${v.font}, system-ui, sans-serif; font-weight:${v.weight || 400}; font-style:${v.style || "normal"}; font-size:${v.size * 0.74}px">${v.word}</h2>
    <div style="display:grid; gap:12px">
      <div class="line" style="font-family:${mono ? v.font : "inherit"}; font-size:${v.type === "pixel" ? 9 : 14}px; line-height:1.5">${v.line}</div>
      <div class="chips"><span style="background:${v.ac}; color:${v.bg}">nodos</span><span style="border:1px solid ${v.fg}">Black Ledger</span></div>
    </div>`;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `<b>${v.name}</b><small>${v.mood} · ${v.type}</small>`;
  const yes = document.createElement("div"); yes.className = "stamp yes"; yes.textContent = "US";
  const no = document.createElement("div"); no.className = "stamp no"; no.textContent = "NOPE";
  c.append(yes, no, spec, meta);
  if (v.remix) { const b = document.createElement("div"); b.className = "badge"; b.textContent = "remix"; c.append(b); }
  return c;
}

let current = null, upcoming = null;
function render() {
  const stack = $("stack");
  stack.innerHTML = "";
  const i = votes.length;
  $("count").textContent = Math.min(i + 1, TOTAL) + " / " + TOTAL;
  $("prog").style.width = (i / TOTAL * 100) + "%";
  if (i >= TOTAL) return showResults();
  if (shown.length === i) shown.push(nextCard());
  current = shown[i];
  const r1 = i < SEED;
  $("phase").innerHTML = r1 ? "Round 1 · <b>map</b>" : "Round 2 · <b>" + (current.remix ? "remix" : "explore") + "</b>";
  $("phase-note").textContent = r1 ? "12 wide-apart looks" : current.remix ? "your likes, recombined" : "checking a blind spot";
  const top = cardEl(current);
  stack.append(top);
  drag(top);
}

function decide(like, card) {
  if (busy || votes.length >= TOTAL) return;
  busy = true;
  card = card || $("stack").lastElementChild;
  card.style.transform = `translateX(${like ? 140 : -140}%) rotate(${like ? 18 : -18}deg)`;
  card.style.opacity = "0";
  votes.push({ card: current, like });
  setTimeout(() => { busy = false; render(); }, 260);
}

function drag(card) {
  let x0 = null, dx = 0;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => { x0 = e.clientX; card.classList.add("dragging"); card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null; card.classList.remove("dragging");
    if (Math.abs(dx) > 90) decide(dx > 0, card);
    else { card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
    dx = 0;
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

$("btn-yes").onclick = () => decide(true);
$("btn-no").onclick = () => decide(false);
$("btn-undo").onclick = () => { if (!busy && votes.length && votes.length < TOTAL) { votes.pop(); shown.length = votes.length + 1; render(); } };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") decide(true); else if (e.key === "ArrowLeft") decide(false); });

function tally() {
  const out = {};
  for (const a of AXES) {
    const m = {};
    votes.forEach(v => { const k = v.card[a]; m[k] = m[k] || { yes: 0, n: 0 }; m[k].n++; if (v.like) m[k].yes++; });
    out[a] = Object.entries(m).map(([k, s]) => ({ k, pct: Math.round(s.yes / s.n * 100), yes: s.yes, n: s.n }))
      .sort((p, q) => q.pct - p.pct || q.yes - p.yes);
  }
  return out;
}

async function showResults() {
  ["stack", "controls", "hint"].forEach(id => $(id).hidden = true);
  $("phase").textContent = "done"; $("phase-note").textContent = "";
  const t = tally();
  const liked = votes.filter(v => v.like).map(v => v.card);
  const remixes = liked.filter(c => c.remix);
  const labels = { mood: "Mood", color: "Colour", type: "Type", density: "Density" };
  const r = $("results");
  r.hidden = false;
  r.innerHTML = `
    <h2>You lean ${t.mood[0].k}, with ${t.type[0].k} type and ${t.color[0].k} colour.</h2>
    <p>You liked ${liked.length} of ${TOTAL}, including ${remixes.length} remixes the deck made from your earlier likes.</p>
    ${AXES.map(a => `<div class="dim"><h3>${labels[a]}</h3>${t[a].map(x => `<div class="row"><span>${x.k}</span><span class="track"><i style="width:${x.pct}%"></i></span><span>${x.pct}%</span></div>`).join("")}</div>`).join("")}
    <div class="dim"><h3>Liked</h3><div class="liked">${liked.map(c => `<span class="${c.remix ? "remix" : ""}">${c.name}</span>`).join("") || "<span>None. Brutal.</span>"}</div></div>
    <p class="status" id="status">Saving…</p>
    <div class="actions"><button class="btn ghost" id="again">Start over</button></div>`;
  $("again").onclick = () => location.reload();

  const summary = Object.fromEntries(AXES.map(a => [a, t[a].map(x => `${x.k} ${x.pct}%`)]));
  const payload = { at: new Date().toISOString(), liked: liked.map(c => c.name), votes: votes.map(v => ({ id: v.card.id, like: v.like })), summary };
  let saved = false;
  try { const db = await claude.use("db"); if (db) { await db.doc("results/r" + Date.now()).set(payload); saved = true; } } catch (e) {}
  if (saved) { $("status").textContent = "Sent to Claude. Say you're done and it will design from this."; return; }
  $("status").textContent = "Your taste profile. Copy it and paste it to your agent:";
  const ta = document.createElement("textarea");
  ta.id = "result-text"; ta.readOnly = true;
  ta.value = "Vibe check (" + TOTAL + " cards)\nLiked: " + payload.liked.join(", ") + "\n" + AXES.map(a => a + ": " + summary[a].join(", ")).join("\n");
  $("status").after(ta);
  const cp = document.createElement("button");
  cp.className = "btn"; cp.textContent = "Copy profile";
  cp.onclick = () => navigator.clipboard.writeText(ta.value).then(() => cp.textContent = "Copied", () => ta.select());
  r.querySelector(".actions").prepend(cp);
}

render();
</script>
