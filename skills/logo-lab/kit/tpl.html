<title>Bodring Logo Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Work+Sans:wght@400;600&display=swap">
<style>
/* Layout: one section per real-world use, each comparing all eight marks side by side. Riso palette on purpose (light only). */
:root { --paper:#eceee4; --green:#00915a; --pink:#ff4aa2; --ink:#12352a; --muted:#3f6155; --card:#f5f6ef; --line:#c9d0c0;
  --display:"Bagel Fat One","Arial Black",sans-serif; --body:"Work Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace; color-scheme:light; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; }
.wrap { max-width:1180px; margin:0 auto; padding-block:24px 56px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
h1 { font-family:var(--display); font-weight:400; font-size:clamp(34px,6vw,58px); line-height:1; margin:0; color:var(--green); }
.sub { margin:8px 0 0; color:var(--muted); max-width:66ch; }
section { margin-top:40px; }
h2 { font-family:var(--display); font-weight:400; font-size:28px; color:var(--green); margin:0; }
.hint { margin:2px 0 14px; color:var(--muted); }
.row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
@media (max-width:820px) { .row { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.cell { margin:0; display:grid; gap:6px; }
.cell.chosen > div { outline:3px solid var(--pink); outline-offset:2px; }
figcaption { font-family:var(--mono); font-size:12px; color:var(--muted); }
/* verdict */
.verdict { margin-top:24px; background:var(--card); border:2px solid var(--green); padding:18px; display:grid; gap:10px; }
.verdict h2 { font-size:24px; }
.verdict ol { margin:0; padding-left:20px; display:grid; gap:4px; }
.picks { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
.pick { display:grid; justify-items:center; gap:6px; padding:10px; background:var(--paper); border:2px solid var(--line); cursor:pointer; font:500 12px var(--mono); color:var(--ink); }
.pick img { width:64px; height:64px; }
.pick.on { border-color:var(--pink); background:#ffe3f1; }
.pick:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
textarea { width:100%; min-height:64px; padding:10px; font:14px var(--body); border:2px solid var(--green); background:var(--paper); color:var(--ink); }
.status { font-family:var(--mono); font-size:13px; min-height:1.5em; }
.tbl { overflow-x:auto; }
table { border-collapse:collapse; width:100%; min-width:640px; font-size:13px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px dotted var(--green); white-space:nowrap; }
thead th { font:500 11px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
tbody th { font-weight:600; display:flex; align-items:center; gap:8px; }
tbody th img { width:26px; height:26px; }
.d { color:var(--green); letter-spacing:1px; } .d i { font-style:normal; color:var(--line); }
.tot { font:600 14px var(--mono); }
tr.best { background:#ffe3f1; }
h3 { font:500 12px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 0 8px; }
.prow { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.prow figure { margin:0; display:grid; gap:4px; }
.prow img { width:100%; display:block; border:1px solid var(--line); }
/* site */
.m-site { background:var(--paper); border:1px solid var(--line); padding:12px 14px 16px; overflow:hidden; }
.m-site .nav { display:flex; align-items:center; gap:6px; font:500 10px var(--mono); text-transform:uppercase; letter-spacing:.08em; }
.m-site .nav img { width:16px; height:16px; }
.m-site .hero { font-family:var(--display); color:var(--green); font-size:clamp(34px,4.6vw,52px); line-height:1; margin-top:14px; text-shadow:.03em .025em 0 var(--pink); white-space:nowrap; }
.m-site .hero img { height:.74em; width:.74em; vertical-align:-.02em; margin:0 .01em; }
/* wall */
.m-wall { aspect-ratio:4/5; background:radial-gradient(circle at 30% 20%,#5b5f5c,#2f3331 70%); position:relative; display:grid; place-items:center; overflow:hidden; }
.m-wall::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.25) 23px 25px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(0,0,0,.18) 47px 49px); }
.poster { position:relative; width:64%; background:var(--paper); padding:10% 8% 8%; display:grid; justify-items:center; gap:4px; transform:rotate(-2deg); box-shadow:0 6px 16px rgba(0,0,0,.45); }
.poster img { width:100%; }
.poster b { font-family:var(--display); font-weight:400; color:var(--green); font-size:clamp(14px,2.2vw,22px); line-height:1; margin-top:6px; }
.poster small { font:500 8px var(--mono); text-transform:uppercase; letter-spacing:.1em; }
.tape { position:absolute; top:-6px; left:38%; width:24%; height:12px; background:rgba(255,255,255,.55); transform:rotate(3deg); }
/* phone */
.m-phone { background:linear-gradient(160deg,#283a33,#0e1f19); border-radius:18px; padding:18px 10px; display:flex; justify-content:space-around; }
.app { display:grid; justify-items:center; gap:4px; }
.app i { font-style:normal; font-size:10px; color:#e8eee9; }
.ic { width:58px; height:58px; border-radius:14px; display:grid; place-items:center; overflow:hidden; }
.ic img { width:84%; height:84%; }
.ic.paper { background:var(--paper); } .ic.green { background:var(--green); }
/* ig */
.m-ig { background:#fff; border:1px solid #dbdbdb; padding:14px; display:flex; align-items:center; gap:10px; }
.av { width:62px; height:62px; flex:none; border-radius:50%; padding:2px; background:conic-gradient(#feda75,#d62976,#962fbf,#4f5bd5,#feda75); }
.av img { width:100%; height:100%; border-radius:50%; background:var(--paper); border:2px solid #fff; display:block; padding:3px; }
.m-ig b { font-size:13px; display:block; } .m-ig small { font-size:11px; color:#555; }
/* tab */
.m-tab { background:#dee1e6; padding:10px 10px 12px; display:flex; align-items:center; gap:14px; }
.tab { background:#fff; border-radius:8px 8px 0 0; padding:7px 12px; display:flex; align-items:center; gap:7px; font:12px system-ui,sans-serif; color:#333; flex:1; min-width:0; }
/* lid */
.m-lid { aspect-ratio:4/3; background:linear-gradient(135deg,#3a3d42,#1d1f22); border-radius:10px; display:grid; place-items:center; }
.m-lid img { width:46%; transform:rotate(-8deg); filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
/* silhouette */
.m-sil { aspect-ratio:4/3; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; }
.m-sil img { width:52%; }
</style>
<div class="wrap">
  <header>
    <h1>Logo, tried for real</h1>
    <p class="sub">The eight image-model slices, redrawn by hand as clean SVG and put in seven real places. Scroll the uses, then pick at the bottom.</p>
  </header>
  %VERDICT%
  %PHOTOS%
  %BODY%
  <section class="verdict" aria-label="Pick">
    <h2>Your pick</h2>
    <div class="picks">%PICKS%</div>
    <label for="note"><b>Mix or tweak?</b> (optional)</label>
    <textarea id="note" placeholder="e.g. 07 chunky, but with the bite from 04"></textarea>
    <div class="status" id="status" role="status"></div>
  </section>
</div>
<script>
const names = %NAMES%;
let chosen = null, saving = false;
const status = document.getElementById("status");
async function save() {
  if (saving) return;
  const note = document.getElementById("note").value.trim();
  if (!chosen && !note) return;
  saving = true; status.textContent = "Sending to Claude…";
  let ok = false;
  try { const db = await claude.use("db"); if (db) { await db.doc("picks/latest").set({ pick: chosen, note, at: new Date().toISOString() }); ok = true; } } catch (e) {}
  status.textContent = ok ? `Sent${chosen ? ": " + names[chosen] : ""}. Tell Claude you've picked.` : `Couldn't send. Just tell Claude${chosen ? ': "' + names[chosen] + '"' : ""}.`;
  saving = false;
}
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
  chosen = b.dataset.k;
  document.querySelectorAll(".pick").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".cell").forEach(c => c.classList.toggle("chosen", c.dataset.k === chosen));
  save();
}));
let t; document.getElementById("note").addEventListener("input", () => { clearTimeout(t); t = setTimeout(save, 900); });
</script>
